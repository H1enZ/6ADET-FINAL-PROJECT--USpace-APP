# Every Flutter project has one of these. It names your app, sets the Dart
# version it needs, and lists the packages you depend on.
# Add a package with: flutter pub add <name>
name: final_project
description: USpace, a private app for two people in one relationship.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  # Phone frame around the app in the browser.
  device_preview: ^1.3.1
  # Sign-in, database and photo storage (see docs/01-proposal.md).
  supabase_flutter: ^2.9.0
  # Poppins and Inter, from docs/03-design-system.md.
  google_fonts: ^6.2.1
  # Choosing a photo for a memory (works on web and phones).
  image_picker: ^1.1.2
  # Remembers the Light / Dark / System choice on this device.
  shared_preferences: ^2.3.0
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Home mood artwork: one transparent PNG per Home mood, named by its
  # database value (loved.png, need_a_hug.png, ...). Until a file exists the
  # app draws a placeholder in its place.
  # Chat reaction artwork works the same way: assets/reactions/<key>.png
  # (love.png, in_love.png, puppy_eyes.png, ...).
  # USpace's own line icons (lib/widgets/atoms/us_icon.dart): 24 px grid,
  # 1.75 stroke, tinted at runtime. Preview: docs/03-design-system.md.
  assets:
    - assets/moods/
    - assets/reactions/
    - assets/icons/
