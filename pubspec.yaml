# Every Flutter project has one of these. It names your app, sets the Dart
# version it needs, and lists the packages you depend on.
# Add a package with: flutter pub add <name>
name: final_project
description: USpace, a private app for two people in one relationship.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  # Phone frame around the app in the browser.
  device_preview: ^1.3.1
  # Sign-in, database and photo storage (see docs/01-proposal.md).
  supabase_flutter: ^2.9.0
  # Poppins and Inter, from docs/03-design-system.md.
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
